<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果俄罗斯方块</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #fff; margin-bottom: 10px; }
        .container { display: flex; gap: 20px; }
        canvas { background: #0a0a0a; border-radius: 8px; }
        .info {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            min-width: 120px;
        }
        .info div { margin-bottom: 10px; }
        .info span { color: #74b9ff; font-size: 1.5em; font-weight: bold; }
        .controls { color: #aaa; margin-top: 15px; text-align: center; font-size: 0.9em; }
        a { color: #74b9ff; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <h1>🍎🍌🍇 水果俄罗斯方块</h1>
    <div class="container">
        <canvas id="game" width="300" height="600"></canvas>
        <div class="info">
            <div>分数<br><span id="score">0</span></div>
            <div>等级<br><span id="level">1</span></div>
            <div>消除行<br><span id="lines">0</span></div>
            <div>下一个<br><canvas id="next" width="80" height="80"></canvas></div>
        </div>
    </div>
    <div class="controls">←→移动 | ↑旋转 | ↓加速 | 空格落地 | P暂停</div>
    <a href="index.html">← 返回游戏列表</a>

    <script>
        // 3张水果图片
        const img1 = new Image(); img1.src = '/my-blog/images/fruits/ea18bbb6-bb82-46fe-94f6-c79e5ace3e0f.png';
        const img2 = new Image(); img2.src = '/my-blog/images/fruits/c445134b-784d-4a4e-9a0a-73016a0b13b5.png';
        const img3 = new Image(); img3.src = '/my-blog/images/fruits/859f6f20-3921-4c68-b5f3-d761edfb26eb.png';
        
        // 7种方块对应3张图片
        const imgs = [null, img1, img2, img3, img1, img2, img3, img1];
        
        const cvs = document.getElementById('game');
        const ctx = cvs.getContext('2d');
        const ncvs = document.getElementById('next');
        const nctx = ncvs.getContext('2d');
        const COLS = 10, ROWS = 20, SIZE = 30;
        
        const SHAPES = [
            [], [[0,1,0],[1,1,1]], [[0,2,2],[2,2,0]], [[3,3,0],[0,3,3]],
            [[4,0,0],[4,4,4]], [[0,0,5],[5,5,5]], [[6,6],[6,6]], [[0,7,0,0],[0,7,0,0],[0,7,0,0],[0,7,0,0]]
        ];
        
        let board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let piece, nextPiece, score = 0, level = 1, lines = 0;
        let gameOver = false, paused = false;
        let dropCounter = 0, lastTime = 0;
        
        function newPiece(type) {
            return { shape: SHAPES[type].map(r => [...r]), type: type, x: 4, y: 0 };
        }
        
        function randomPiece() { return newPiece(Math.floor(Math.random() * 7) + 1); }
        
        function rotate(p) {
            const n = p.shape.length, m = p.shape[0].length;
            let r = Array(m).fill().map(() => Array(n).fill(0));
            for(let i=0;i<n;i++) for(let j=0;j<m;j++) r[j][n-1-i] = p.shape[i][j];
            return r;
        }
        
        function valid(p, dx=0, dy=0, s=null) {
            s = s || p.shape;
            for(let y=0;y<s.length;y++) for(let x=0;x<s[y].length;x++) if(s[y][x]) {
                let nx = p.x + x + dx, ny = p.y + y + dy;
                if(nx<0||nx>=COLS||ny>=ROWS||(ny>=0&&board[ny][nx])) return false;
            }
            return true;
        }
        
        function merge() {
            piece.shape.forEach((r,y)=>r.forEach((v,x)=>{
                if(v && piece.y+y>=0) board[piece.y+y][piece.x+x] = v;
            }));
        }
        
        function clear() {
            for(let y=ROWS-1;y>=0;y--) {
                if(board[y].every(v=>v)) {
                    board.splice(y,1); board.unshift(Array(COLS).fill(0));
                    lines++; score += [0,100,300,500,800][Math.min(lines%10,4)] * level;
                    level = Math.floor(lines/10)+1;
                    y++;
                }
            }
        }
        
        function drawBlock(c, x, y, type, sz) {
            const i = imgs[type];
            if(i && i.complete && i.naturalWidth>0) {
                c.drawImage(i, x*sz+2, y*sz+2, sz-4, sz-4);
            } else {
                c.fillStyle = '#fff'; c.fillRect(x*sz+2, y*sz+2, sz-4, sz-4);
            }
        }
        
        function draw() {
            ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0,0,300,600);
            board.forEach((r,y)=>r.forEach((v,x)=>v && drawBlock(ctx,x,y,v,SIZE)));
            if(piece) piece.shape.forEach((r,y)=>r.forEach((v,x)=>v && drawBlock(ctx,piece.x+x,piece.y+y,v,SIZE)));
            
            nctx.fillStyle = '#1a1a2e'; nctx.fillRect(0,0,80,80);
            if(nextPiece) {
                const s = nextPiece.shape;
                const sx = Math.floor((80 - s[0].length * 18) / 2);
                const sy = Math.floor((80 - s.length * 18) / 2);
                s.forEach((r,y)=>r.forEach((v,x)=>{
                    if(v) nctx.drawImage(imgs[nextPiece.type], sx + x*18+2, sy + y*18+2, 14, 14);
                }));
            }
            
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
            
            if(gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,300,600);
                ctx.fillStyle = '#ff6b6b'; ctx.font = '30px Arial'; ctx.textAlign='center';
                ctx.fillText('游戏结束!',150,280); ctx.fillStyle='#fff'; ctx.fillText('分数:'+score,150,320);
            }
            if(paused && !gameOver) {
                ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,300,600);
                ctx.fillStyle='#fff'; ctx.font='30px Arial'; ctx.textAlign='center';
                ctx.fillText('暂停',150,300);
            }
        }
        
        function update(t=0) {
            if(gameOver || paused) { requestAnimationFrame(update); return; }
            let dt = t - lastTime; lastTime = t; dropCounter += dt;
            if(dropCounter > Math.max(100, 1000-(level-1)*50)) {
                if(valid(piece,0,1)) piece.y++; else { merge(); clear(); piece=nextPiece||randomPiece(); nextPiece=randomPiece(); if(!valid(piece)) gameOver=true; }
                dropCounter=0;
            }
            draw(); requestAnimationFrame(update);
        }
        
        function start() {
            piece = randomPiece(); nextPiece = randomPiece(); draw(); update();
        }
        
        document.addEventListener('keydown', e => {
            if(gameOver && e.code==='Space') { board=Array(ROWS).fill().map(()=>Array(COLS).fill(0)); score=0; level=1; lines=0; gameOver=false; piece=nextPiece=randomPiece(); return; }
            if(gameOver || paused) return;
            switch(e.code) {
                case 'ArrowLeft': if(valid(piece,-1,0)) piece.x--; break;
                case 'ArrowRight': if(valid(piece,1,0)) piece.x++; break;
                case 'ArrowDown': if(valid(piece,0,1)) piece.y++; break;
                case 'ArrowUp': let r=rotate(piece); if(valid(piece,0,0,r)) piece.shape=r; break;
                case 'Space': while(valid(piece,0,1)) piece.y++; merge(); clear(); piece=nextPiece||randomPiece(); nextPiece=randomPiece(); if(!valid(piece)) gameOver=true; break;
                case 'KeyP': paused=true; break;
            }
            draw();
        });
        
        window.onload = start;
    </script>
</body>
</html>
