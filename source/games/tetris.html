<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍎🍌🍇 水果俄罗斯方块 - 炜煜之博客</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 { color: #fff; margin-bottom: 15px; font-size: 2em; }
        .game-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }
        canvas { border-radius: 10px; box-shadow: 0 0 30px rgba(116, 185, 255, 0.3); }
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .info-box {
            background: rgba(255,255,255,0.1);
            padding: 15px 20px;
            border-radius: 10px;
            color: #fff;
        }
        .info-label { color: #aaa; font-size: 0.9em; }
        .info-value { font-size: 1.5em; font-weight: bold; color: #74b9ff; }
        #nextCanvas { border-radius: 8px; }
        .controls {
            margin-top: 20px;
            color: #aaa;
            text-align: center;
        }
        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🍎🍌🍇 水果俄罗斯方块</h1>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="800"></canvas>
        <div class="side-panel">
            <div class="info-box">
                <div class="info-label">分数</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-box">
                <div class="info-label">等级</div>
                <div class="info-value" id="level">1</div>
            </div>
            <div class="info-box">
                <div class="info-label">消除行数</div>
                <div class="info-value" id="lines">0</div>
            </div>
            <div class="info-box">
                <div class="info-label">下一个</div>
                <canvas id="nextCanvas" width="120" height="120"></canvas>
            </div>
        </div>
    </div>
    <div class="controls">
        <p>← → 移动 | ↑ 旋转 | ↓ 加速 | 空格 瞬间下落 | P 暂停</p>
    </div>
    <a href="index.html" class="back-btn">← 返回游戏选择</a>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 40;  // 增大到 40px
        
        const FRUITS = [
            null,
            '🍎', // T - 红色苹果
            '🍌', // S - 香蕉
            '🍇', // Z - 葡萄
            '🍊', // L - 橘子
            '🍋', // J - 柠檬
            '🍓', // O - 草莓
            '🍒'  // I - 樱桃
        ];
        
        // 水果背景色
        const FRUIT_COLORS = [
            null,
            '#ff6b6b', '#ffe66d', '#a29bfe', '#fd79a8', '#fab1a0', '#ff7675', '#e74c3c'
        ];
        
        const SHAPES = [
            [],
            [[0,1,0],[1,1,1]], // T
            [[0,2,2],[2,2,0]], // S
            [[3,3,0],[0,3,3]], // Z
            [[4,0,0],[4,4,4]], // L
            [[0,0,5],[5,5,5]], // J
            [[6,6],[6,6]],     // O
            [[0,7,0,0],[0,7,0,0],[0,7,0,0],[0,7,0,0]] // I
        ];
        
        let board = [];
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameOver = false;
        let isPaused = false;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let currentPiece = null;
        let nextPiece = null;
        let particles = [];
        
        function initBoard() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
        }
        
        function createPiece(type) {
            const shape = SHAPES[type].map(row => [...row]);
            return {
                shape: shape,
                type: type,
                x: Math.floor(COLS / 2) - Math.floor(shape[0].length / 2),
                y: 0
            };
        }
        
        function getRandomPiece() {
            return Math.floor(Math.random() * 7) + 1;
        }
        
        function rotate(piece) {
            const n = piece.shape.length;
            const m = piece.shape[0].length;
            const rotated = Array(m).fill(null).map(() => Array(n).fill(0));
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < m; j++) {
                    rotated[j][n - 1 - i] = piece.shape[i][j];
                }
            }
            return rotated;
        }
        
        function isValid(piece, offsetX = 0, offsetY = 0, newShape = null) {
            const shape = newShape || piece.shape;
            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[y].length; x++) {
                    if (shape[y][x]) {
                        const newX = piece.x + x + offsetX;
                        const newY = piece.y + y + offsetY;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) return false;
                        if (newY >= 0 && board[newY][newX]) return false;
                    }
                }
            }
            return true;
        }
        
        function merge() {
            currentPiece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        const boardY = currentPiece.y + y;
                        const boardX = currentPiece.x + x;
                        if (boardY >= 0) board[boardY][boardX] = value;
                    }
                });
            });
        }
        
        function clearLines() {
            let cleared = 0;
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(0));
                    cleared++;
                    y++;
                    
                    // 特效 - 水果爆炸
                    for (let x = 0; x < COLS; x++) {
                        const randomFruit = Math.floor(Math.random() * 7) + 1;
                        createExplosion(x * BLOCK_SIZE + 15, y * BLOCK_SIZE + 15, FRUIT_COLORS[randomFruit]);
                    }
                }
            }
            if (cleared > 0) {
                lines += cleared;
                score += [0, 100, 300, 500, 800][cleared] * level;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 50);
                updateUI();
            }
        }
        
        function createExplosion(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 20,
                    color: color
                });
            }
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life--;
                return p.life > 0;
            });
        }
        
        function drawParticles(ctx) {
            particles.forEach(p => {
                ctx.globalAlpha = p.life / 20;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
            });
            ctx.globalAlpha = 1;
        }
        
        function draw() {
            // 清空画布
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * BLOCK_SIZE, 0);
                ctx.lineTo(i * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * BLOCK_SIZE);
                ctx.lineTo(canvas.width, i * BLOCK_SIZE);
                ctx.stroke();
            }
            
            // 绘制已固定的方块
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) {
                        drawBlock(ctx, x, y, board[y][x]);
                    }
                }
            }
            
            // 绘制当前方块
            if (currentPiece) {
                currentPiece.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            drawBlock(ctx, currentPiece.x + x, currentPiece.y + y, value);
                        }
                    });
                });
                
                // 幽灵方块
                let ghostY = currentPiece.y;
                while (isValid(currentPiece, 0, ghostY - currentPiece.y + 1)) {
                    ghostY++;
                }
                ctx.globalAlpha = 0.3;
                currentPiece.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            ctx.strokeStyle = FRUIT_COLORS[value];
                            ctx.strokeRect((currentPiece.x + x) * BLOCK_SIZE + 2, (ghostY + y) * BLOCK_SIZE + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
                        }
                    });
                });
                ctx.globalAlpha = 1;
            }
            
            drawParticles(ctx);
            
            // 游戏结束
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束!', canvas.width/2, canvas.height/2 - 30);
                ctx.fillStyle = '#fff';
                ctx.font = '25px Arial';
                ctx.fillText(`最终分数: ${score}`, canvas.width/2, canvas.height/2 + 10);
            }
            
            // 暂停
            if (isPaused && !gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('已暂停', canvas.width/2, canvas.height/2);
                ctx.font = '20px Arial';
                ctx.fillText('按 P 继续', canvas.width/2, canvas.height/2 + 40);
            }
            
            requestAnimationFrame(draw);
        }
        
        // 水果图案绘制函数
        function drawFruit(ctx, x, y, fruitIndex, size) {
            const cx = x + size/2;
            const cy = y + size/2;
            
            ctx.save();
            
            switch(fruitIndex) {
                case 1: // 🍎 苹果 - 红色圆形带叶
                    // 苹果主体
                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath();
                    ctx.arc(cx, cy + 2, size/2.5, 0, Math.PI * 2);
                    ctx.fill();
                    // 高光
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(cx - size/6, cy - size/10, size/12, size/20, -0.5, 0, Math.PI * 2);
                    ctx.fill();
                    // 叶子
                    ctx.fillStyle = '#27ae60';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy - size/3, size/10, size/20, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                    
                case 2: // 🍌 香蕉 - 黄色弯月形
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, size/2.5, size/4, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    // 纹理
                    ctx.strokeStyle = '#e67e22';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(cx + size/10, cy - size/10, size/15, 0, Math.PI);
                    ctx.stroke();
                    break;
                    
                case 3: // 🍇 葡萄 - 紫色圆球簇
                    ctx.fillStyle = '#9b59b6';
                    for (let i = 0; i < 3; i++) {
                        for (let j = 0; j < 2 - Math.abs(i-1); j++) {
                            ctx.beginPath();
                            ctx.arc(cx + (i-1) * size/5, cy + (j-0.5) * size/5, size/7, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    // 葡萄梗
                    ctx.strokeStyle = '#27ae60';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - size/3);
                    ctx.lineTo(cx, cy - size/2.2);
                    ctx.stroke();
                    break;
                    
                case 4: // 🍊 橘子 - 橙色圆形带纹理
                    ctx.fillStyle = '#e67e22';
                    ctx.beginPath();
                    ctx.arc(cx, cy, size/2.5, 0, Math.PI * 2);
                    ctx.fill();
                    // 橘子纹理点
                    ctx.fillStyle = '#d35400';
                    for (let i = 0; i < 5; i++) {
                        const angle = (i / 5) * Math.PI * 2;
                        const r = size/6;
                        ctx.beginPath();
                        ctx.arc(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;
                    
                case 5: // 🍋 柠檬 - 黄色椭圆带尖
                    ctx.fillStyle = '#f39c12';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, size/2.5, size/3.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 柠檬尖头
                    ctx.beginPath();
                    ctx.moveTo(cx - size/8, cy - size/4);
                    ctx.lineTo(cx, cy - size/2.5);
                    ctx.lineTo(cx + size/8, cy - size/4);
                    ctx.fill();
                    break;
                    
                case 6: // 🍓 草莓 - 红色心形带籽
                    ctx.fillStyle = '#e74c3c';
                    // 草莓形状（心形简化）
                    ctx.beginPath();
                    ctx.moveTo(cx, cy + size/4);
                    ctx.bezierCurveTo(cx - size/3, cy - size/6, cx - size/4, cy - size/3, cx, cy - size/5);
                    ctx.bezierCurveTo(cx + size/4, cy - size/3, cx + size/3, cy - size/6, cx, cy + size/4);
                    ctx.fill();
                    // 草莓籽
                    ctx.fillStyle = '#f39c12';
                    ctx.beginPath();
                    ctx.arc(cx - size/8, cy, 1.5, 0, Math.PI * 2);
                    ctx.arc(cx + size/8, cy - size/12, 1.5, 0, Math.PI * 2);
                    ctx.arc(cx, cy + size/12, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    // 草莓叶
                    ctx.fillStyle = '#27ae60';
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - size/4);
                    ctx.lineTo(cx - size/10, cy - size/6);
                    ctx.lineTo(cx, cy - size/5);
                    ctx.lineTo(cx + size/10, cy - size/6);
                    ctx.fill();
                    break;
                    
                case 7: // 🍒 樱桃 - 红色圆形带柄
                    // 左樱桃
                    ctx.fillStyle = '#c0392b';
                    ctx.beginPath();
                    ctx.arc(cx - size/5, cy + size/8, size/7, 0, Math.PI * 2);
                    ctx.fill();
                    // 右樱桃
                    ctx.beginPath();
                    ctx.arc(cx + size/5, cy + size/8, size/7, 0, Math.PI * 2);
                    ctx.fill();
                    // 高光
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.beginPath();
                    ctx.arc(cx - size/5 - size/20, cy + size/8 - size/20, 2, 0, Math.PI * 2);
                    ctx.arc(cx + size/5 - size/20, cy + size/8 - size/20, 2, 0, Math.PI * 2);
                    ctx.fill();
                    // 樱桃柄
                    ctx.strokeStyle = '#8e44ad';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(cx - size/5, cy - size/8);
                    ctx.quadraticCurveTo(cx, cy - size/2, cx + size/5, cy - size/8);
                    ctx.stroke();
                    break;
            }
            
            ctx.restore();
        }
        
        function drawBlock(ctx, x, y, fruitIndex) {
            const px = x * BLOCK_SIZE;
            const py = y * BLOCK_SIZE;
            const size = BLOCK_SIZE - 4;
            
            // 绘制方块背景（浅色）
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillRect(px + 2, py + 2, size, size);
            
            // 绘制方块边框
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(px + 2, py + 2, size, size);
            
            // 绘制水果图案
            drawFruit(ctx, px + 2, py + 2, fruitIndex, size);
        }
        
        // 预览窗口的水果绘制（简化版）
        function drawFruitPreview(ctx, cx, cy, fruitIndex, size) {
            ctx.save();
            
            switch(fruitIndex) {
                case 1: // 苹果
                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath(); ctx.arc(cx, cy, size/2, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#27ae60';
                    ctx.beginPath(); ctx.ellipse(cx, cy - size/2, size/8, size/15, 0, 0, Math.PI * 2); ctx.fill();
                    break;
                case 2: // 香蕉
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath(); ctx.ellipse(cx, cy, size/2, size/4, 0.3, 0, Math.PI * 2); ctx.fill();
                    break;
                case 3: // 葡萄
                    ctx.fillStyle = '#9b59b6';
                    for (let i = 0; i < 3; i++) {
                        for (let j = 0; j < 2 - Math.abs(i-1); j++) {
                            ctx.beginPath(); ctx.arc(cx + (i-1) * size/4, cy + (j-0.5) * size/4, size/7, 0, Math.PI * 2); ctx.fill();
                        }
                    }
                    break;
                case 4: // 橘子
                    ctx.fillStyle = '#e67e22';
                    ctx.beginPath(); ctx.arc(cx, cy, size/2, 0, Math.PI * 2); ctx.fill();
                    break;
                case 5: // 柠檬
                    ctx.fillStyle = '#f39c12';
                    ctx.beginPath(); ctx.ellipse(cx, cy, size/2, size/3.5, 0, 0, Math.PI * 2); ctx.fill();
                    break;
                case 6: // 草莓
                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath(); ctx.moveTo(cx, cy + size/4);
                    ctx.bezierCurveTo(cx - size/2, cy - size/8, cx - size/3, cy - size/2, cx, cy - size/5);
                    ctx.bezierCurveTo(cx + size/3, cy - size/2, cx + size/2, cy - size/8, cx, cy + size/4); ctx.fill();
                    break;
                case 7: // 樱桃
                    ctx.fillStyle = '#c0392b';
                    ctx.beginPath(); ctx.arc(cx - size/5, cy + size/8, size/6, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + size/5, cy + size/8, size/6, 0, Math.PI * 2); ctx.fill();
                    break;
            }
            
            ctx.restore();
        }
        
        function drawNextPiece() {
            nextCtx.fillStyle = '#1a1a2e';
            nextCtx.fillRect(0, 0, 120, 120);
            
            if (nextPiece) {
                const offsetX = (120 - nextPiece.shape[0].length * 25) / 2;
                const offsetY = (120 - nextPiece.shape.length * 25) / 2;
                nextPiece.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            nextCtx.fillStyle = '#fff';
                            nextCtx.fillRect(offsetX + x * 25 + 2, offsetY + y * 25 + 2, 21, 21);
                            drawFruitPreview(nextCtx, offsetX + x * 25 + 12, offsetY + y * 25 + 12, value, 20);
                        }
                    });
                });
            }
        }
        
        function update(time = 0) {
            if (gameOver || isPaused) {
                requestAnimationFrame(update);
                return;
            }
            
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            
            if (dropCounter > dropInterval) {
                drop();
            }
            
            updateParticles();
            requestAnimationFrame(update);
        }
        
        function drop() {
            if (isValid(currentPiece, 0, 1)) {
                currentPiece.y++;
            } else {
                merge();
                clearLines();
                spawnPiece();
            }
            dropCounter = 0;
        }
        
        function spawnPiece() {
            currentPiece = nextPiece || createPiece(getRandomPiece());
            nextPiece = createPiece(getRandomPiece());
            drawNextPiece();
            
            if (!isValid(currentPiece)) {
                gameOver = true;
            }
        }
        
        function hardDrop() {
            while (isValid(currentPiece, 0, 1)) {
                currentPiece.y++;
                score += 2;
            }
            drop();
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }
        
        // 控制
        document.addEventListener('keydown', (e) => {
            if (gameOver) {
                if (e.code === 'Space') {
                    resetGame();
                }
                return;
            }
            
            switch(e.code) {
                case 'ArrowLeft':
                    if (isValid(currentPiece, -1, 0)) currentPiece.x--;
                    break;
                case 'ArrowRight':
                    if (isValid(currentPiece, 1, 0)) currentPiece.x++;
                    break;
                case 'ArrowDown':
                    if (isValid(currentPiece, 0, 1)) {
                        currentPiece.y++;
                        score += 1;
                        updateUI();
                    }
                    break;
                case 'ArrowUp':
                    const rotated = rotate(currentPiece);
                    if (isValid(currentPiece, 0, 0, rotated)) {
                        currentPiece.shape = rotated;
                    }
                    break;
                case 'Space':
                    hardDrop();
                    break;
                case 'KeyP':
                    isPaused = !isPaused;
                    break;
            }
        });
        
        function resetGame() {
            initBoard();
            score = 0;
            level = 1;
            lines = 0;
            dropInterval = 1000;
            gameOver = false;
            isPaused = false;
            particles = [];
            updateUI();
            spawnPiece();
        }
        
        initBoard();
        spawnPiece();
        draw();
        update();
    </script>
</body>
</html>
